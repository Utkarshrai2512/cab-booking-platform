services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cabdb
      POSTGRES_USER: cabuser
      POSTGRES_PASSWORD: cabpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cabuser -d cabdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://cabuser:cabpass@db:5432/cabdb
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-before-deployment}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
